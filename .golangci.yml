version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
          severity: warning
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: context-as-argument
        - name: indent-error-flow
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        path: _test\.go
      # Test code legitimately uses unguarded type assertions in if-else chains
      # after an error check (e.g. got.(time.Time) where err already checked).
      - linters:
          - errcheck
        path: _test\.go
        text: "Error return value is not checked"
      - path: schema/schema\.go
        text: cyclomatic
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
